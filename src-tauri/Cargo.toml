[package]
name = "instinct"
version = "0.1.0"
description = "INSTINCT — Hughes Technologies desktop DAW"
authors = ["Hughes Technologies"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"

# CoreAudio HAL + AudioUnit hosting. Only pulled in on macOS; other platforms
# fall back to the cpal host provided by their OS (WASAPI on Windows, ALSA on
# Linux). This mirrors the AudioBackend surface exposed to the UI.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11"
core-foundation = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]
