[package]
name = "instinct"
version = "0.1.0"
description = "INSTINCT — Hughes Technologies desktop DAW"
authors = ["Hughes Technologies"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
